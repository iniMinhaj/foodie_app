name: foodie_app
description: "Multi-vendor food ordering app - UI showcase (setState demo, ready for Riverpod migration)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  dio: ^5.11.0
  fpdart: ^1.2.0
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
