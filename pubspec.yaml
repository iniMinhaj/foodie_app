name: foodie_app
description: "Multi-vendor food ordering app — Clean Architecture + Riverpod (no codegen) + go_router"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  equatable: ^2.1.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  uuid: ^4.6.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  path_provider_platform_interface: ^2.1.3
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
